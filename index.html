<!DOCTYPE html>
<html lang="en" data-theme="dark" data-color-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2c313a" />
    <meta name="description" content="" />
    <meta name="robots" content="noindex" />
    <title>AYON</title>
    <!-- FALLBACK FAVICON -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#00d7a0">
    <meta name="msapplication-TileColor" content="#00aba9">
    <!-- FALLBACK FAVICON -->
    <!--
      Paint the saved theme before the first frame, otherwise a light-mode user
      gets a dark flash while the bundle loads. Storage key and values must match
      src/theme/theme.ts.
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('ayon-theme') || 'dark'
          var theme =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode === 'light'
              ? 'light'
              : 'dark'
          var root = document.documentElement
          root.setAttribute('data-theme', theme)
          root.setAttribute('data-color-mode', theme)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f9f9fc' : '#2c313a')
        } catch (e) {
          // storage blocked, the markup default (dark) stands
        }
      })()
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
